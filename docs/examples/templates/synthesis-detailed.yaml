# Detailed Synthesis Template
# Shows advanced formatting options

frontmatter:
  date_format: "2006-01-02 15:04:05"

header: |
  # 📚 Synthesis: {{.Intent | title}}
  
  This document synthesizes **{{len .Results}}** memories related to "{{.Intent}}".

summary_section:
  title: "## 🎯 Overview"
  content: |
    Based on semantic search of the knowledge base, the following memories 
    are most relevant to the query "{{.Intent}}".

learnings_section:
  title: "## 💡 Key Insights"
  item_template: |
    ### {{.Title}}
    
    **Relevance:** {{printf "%.0f%%" (mul .Score 100.0)}} | **Score:** {{printf "%.3f" .Score}}
    
    {{.Preview}}
    
    ---
  content_preview_length: 500

footer: |
  ---
  
  ## ℹ️ About This Document
  
  This synthesis was automatically generated by Cortex's semantic search.
  The relevance scores indicate how closely each memory matches the query.
  
  **Note:** This is a read-only document for reference purposes.
