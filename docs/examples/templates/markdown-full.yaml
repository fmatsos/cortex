# Complete Markdown Template
# Contains both memory and synthesis configurations

memory:
  frontmatter:
    include_id: true
    include_dates: true
    include_metadata: true
    date_format: "2006-01-02"
  body: |
    # {{.Title}}
    
    {{.Content}}

synthesis:
  frontmatter:
    date_format: "2006-01-02"
  header: |
    # {{.Intent | title}} - Synthesis
    
    Analyzed {{len .Results}} memories.
  summary_section:
    title: "## Summary"
    content: "Relevant information found:"
  learnings_section:
    title: "## Details"
    item_template: |
      ### {{.Title}} ({{printf "%.0f%%" (mul .Score 100.0)}})
      
      {{.Preview}}
    content_preview_length: 400
  footer: |
    ---
    *Generated by Cortex AI*
