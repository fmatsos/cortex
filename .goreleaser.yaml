# GoReleaser configuration for Cortex AI
# See https://goreleaser.com for documentation

version: 2

project_name: cortex-ai

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: cortex
    main: ./cmd/cortex
    binary: cortex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - id: default
    builds:
      - cortex
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: cortex-ai
    name: cortex-ai
  draft: false
  prerelease: auto
  mode: replace

brews:
  - name: cortex-ai
    repository:
      owner: cortex-ai
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    directory: Formula
    homepage: https://github.com/cortex-ai/cortex-ai
    description: CLI tool for persistent AI agent memory with semantic search
    license: MIT
    test: |
      system "#{bin}/cortex", "--help"
    install: |
      bin.install "cortex"

dockers:
  - image_templates:
      - "ghcr.io/cortex-ai/cortex-ai:{{ .Tag }}"
      - "ghcr.io/cortex-ai/cortex-ai:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

nfpms:
  - id: packages
    package_name: cortex-ai
    builds:
      - cortex
    vendor: Cortex AI
    homepage: https://github.com/cortex-ai/cortex-ai
    maintainer: Cortex AI Contributors
    description: CLI tool for persistent AI agent memory with semantic search
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
