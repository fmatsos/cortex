[project]
name = "cortex-memory"
version = "0.1.0"
description = "Three-layer semantic memory system for AI assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.15",
    "pydantic>=2.10",
    "pydantic-settings[yaml]>=2.7",
    "chromadb>=0.6",
    "httpx>=0.28",
    "mcp>=1.9",
    "python-frontmatter>=1.1",
    "rich>=13.9",
    "cachetools>=5.5",
    "numpy>=2.2",
    "PyYAML>=6.0",
]

[project.scripts]
cortex = "cortex.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "syrupy>=4.8",
    "ruff>=0.9",
    "mypy>=1.15",
    "types-cachetools>=5.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF", "C4", "PTH"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["cortex"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/cortex"]
