# Cortex Configuration
# See docs/guides/configuration.md for all options

[storage]
backend = "chroma"        # chroma (only supported backend)
path = ".agents/cortex"   # project-local storage

[embeddings]
provider = "ollama"
model = "nomic-embed-text"
endpoint = "http://localhost:11434"
timeout = 30
chunk_size = 8000         # max chars per chunk (0 = no chunking)
chunk_overlap = 200       # overlap between chunks for context
chunk_strategy = "average"  # average | first | max_pool

[search]
top_k = 5
min_score = 0.5
include_obsolete = false

[output]
format = "text"   # text | json
colors = true

[logging]
level = "info"
file = ""

[consolidation]
similarity_threshold = 0.85
auto_transfer_on_session_end = true

[autoprune]
duplicates_threshold = 0.92
episodic_retention_days = 90
semantic_merge_threshold = 0.88

[session]
auto_derive = true          # automatically derive session ID from git branch
pattern_type = "prefix"     # prefix | regex | full
pattern = ""                # regex pattern (only used when pattern_type = "regex")
prefix = "session-"         # prefix to add to derived session ID
separator = "-"             # separator for branch name parts
max_segments = 2            # max number of branch segments (0 = all)
strip_prefix = ""           # optional prefix to strip from branch name
fallback_to_uuid = true     # fallback to UUID if pattern doesn't match

[mcp]
transport = "stdio"
address = ":8080"
