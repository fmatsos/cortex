<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>try{var t=localStorage.getItem("brain:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- repli sans JavaScript : la lecture reste possible (pages prérendues), mais recherche, favoris, thème et graphe en ont besoin -->
		<noscript>
			<p class="bg-muted text-foreground border-b px-4 py-2 text-center text-sm">
				JavaScript est désactivé : la lecture des pages fonctionne, mais la recherche, les favoris, le thème et le graphe en ont besoin.
				Parcourez le wiki depuis <a class="underline underline-offset-4" href="%sveltekit.assets%/">l'accueil (catalogue complet)</a>
				ou <a class="underline underline-offset-4" href="%sveltekit.assets%/tags/">les tags</a>.
			</p>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
