		* { box-sizing: border-box; border-color: var(--border); }
		[hidden] { display: none !important; }
		html { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--foreground); background: var(--secondary); }
		body { margin: 0; font-size: 16px; line-height: 1.6; }
		button, input, select, textarea { font: inherit; color: inherit; border-radius: var(--radius); }
		button, a, summary, select, label[for], input[type="radio"], input[type="checkbox"] { cursor: pointer; }
		button { background: none; }
		a { color: var(--link); text-underline-offset: 4px; }
		a:hover { text-decoration: underline; }
		button:disabled { cursor: not-allowed; opacity: .6; }
		:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

			if (screen === 'search') state.scope = 'current';
			if (screen === 'search-all') state.scope = 'all';
			if (screen === 'search-set') state.scope = 'set';
			if (!signedIn()) state.scope = 'current';
			if (screen === 'article' && (!documents[state.article] || !activeSpaces().some((s) => s.id === documents[state.article].space))) state.screen = '404';
			if (['home', 'mixed', 'notes', 'read-only', 'empty', 'veille'].includes(screen) && (!byId(state.current) || byId(state.current).archived)) state.screen = '404';
			state.spaceNavigation = false;
			render(focus); window.scrollTo({ top: 0, behavior: 'instant' });
		}
		function setMenu(open, refocus = false) {
			const trigger = $('#space-trigger'), menu = $('#space-menu');
			if (!trigger || !menu) return;
			trigger.setAttribute('aria-expanded', String(open)); menu.hidden = !open;
			if (refocus) trigger.focus();
		}
		function validateName(taken = false) {
			const input = $('#space-name');
			if (!input) return false;
			const name = input.value, valid = /^[a-z0-9][a-z0-9-]*$/.test(name) && name.length <= 40;
			$('#name-error').textContent = !valid ? 'Utilisez des minuscules, des chiffres et des tirets, en commençant par une lettre ou un chiffre.' : taken ? 'Ce nom n’est pas disponible. Choisissez un autre nom.' : '';
			input.setAttribute('aria-invalid', String(!valid || taken)); $('#url-name').textContent = name || 'nom-de-lespace';
			return valid && !taken;
		}
		function openDialog(type, text = '') {
			if (!modal.open) state.modalReturn = document.activeElement;
			const space = settingsSpace();
			const close = `<button class="btn icon-btn quiet close-dialog" data-close aria-label="Fermer">${icon('clear')}</button>`;
			const cancel = '<button class="btn" type="button" data-close>Annuler</button>';
			let title = '', body = '';
			if (type === 'archive') {
				title = `Archiver ${esc(space.title)} ?`;
				body = `<p class="small muted" style="margin-bottom:1.25rem">L’espace disparaîtra pour tout le monde. Ses pages ne seront plus servies et il sera absent du sélecteur et de la recherche. Ses propriétaires pourront le restaurer depuis « Espaces archivés ».</p><p class="notice warning" style="margin-bottom:1rem">Le mode lecture seule sera conservé. L’archivage cache l’espace, il ne change pas ses droits.</p><form id="archive-form"><div class="field"><label for="confirm-name">Saisissez le slug <strong>${esc(space.name)}</strong> pour confirmer</label><input id="confirm-name" type="text" autocomplete="off" spellcheck="false" data-confirm="${esc(space.name)}"></div><div class="form-actions">${cancel}<button id="archive-confirm" class="btn danger" type="submit" disabled>Archiver l’espace</button></div></form>`;
			} else if (type === 'restore') {
				const archived = byId(state.restore);
				title = `Restaurer ${esc(archived.title)} ?`;
				body = `<p class="small muted" style="margin-bottom:1rem">L’espace sera à nouveau servi, proposé dans le sélecteur et inclus dans la recherche pour les personnes autorisées. Ses accès et son mode ${archived.readOnly ? 'lecture seule' : 'modifiable'} seront conservés.</p><p class="url-preview">/s/${esc(archived.name)}/</p><p id="restore-error" class="error" role="alert" style="margin-top:1rem">${state.screen === 'restore-taken' && spaces.some((s) => !s.archived && s.name === archived.name) ? 'Le nom est repris par un autre espace' : ''}</p><div class="form-actions">${cancel}<button class="btn primary" data-confirm-restore>Restaurer</button></div>`;
			} else if (type === 'capture-note' || type === 'capture-source') {
				if (current().readOnly) { openDialog('message', readOnlyReason); return; }
				state.capture = type === 'capture-note' ? 'notes' : 'ressources';
				title = `${state.capture === 'notes' ? 'Ajouter une note' : 'Ajouter une source'} ${soon}`;
				body = `<p class="small muted" style="margin-bottom:1rem">Dans <strong>${esc(current().title)}</strong>. Proposition de capture web, à venir.</p><form id="capture-form"><div class="field"><label for="capture-title">Titre</label><input id="capture-title" type="text" required placeholder="${state.capture === 'notes' ? 'Point avec Marie, projet Atlas' : 'Documentation du projet Atlas'}"></div><div class="field"><label for="capture-body">${state.capture === 'notes' ? 'Votre note brute' : 'URL ou texte de la source'}</label><textarea id="capture-body" required placeholder="${state.capture === 'notes' ? 'Faits, décisions, dates et actions…' : 'URL de la documentation ou texte de la source…'}"></textarea></div><div class="form-actions">${cancel}<button class="btn primary" type="submit">Ajouter puis compiler</button></div></form>`;
			} else if (type === 'cli') {
				title = 'Ajouter du contenu depuis le terminal';
				body = `<p class="small muted">Dans <strong>${esc(current().title)}</strong> :</p><ol style="padding-left:1.25rem;margin:1rem 0"><li>Ajouter un fichier :<div class="url-preview" style="margin:.5rem 0;user-select:all"><code>cortex add ./note.md --space ${esc(current().name)}</code></div></li><li>Compiler :<div class="url-preview" style="margin:.5rem 0;user-select:all"><code>cortex compile --space ${esc(current().name)} --pending</code></div></li></ol><div class="form-actions"><button class="btn" data-close>Fermer</button></div>`;
			} else if (type === 'visibility') {
				state.visibility = $('input[name="visibility"]:checked').value;
				title = `${state.visibility === 'open' ? 'Ouvrir' : 'Rendre privé'} ${esc(space.title)} ?`;
				body = `<p>${state.visibility === 'open' ? 'Tous les visiteurs pourront lire les pages. La liste des membres sera vidée : un espace ouvert n’a aucun membre. La propriété et le mode lecture seule seront conservés.' : 'Vous deviendrez le premier propriétaire membre. Les autres visiteurs recevront une 404.'}</p><div class="form-actions">${cancel}<button class="btn primary" data-confirm-visibility>Confirmer</button></div>`;
			} else {
				title = type === 'assistant' ? 'Assistant de cet espace' : type === 'journey' ? 'Parcours enregistré' : 'Simulation';
				body = `<p class="small muted">${esc(text || (type === 'journey' ? 'Ce parcours est conservé dans votre compte de démonstration. La lecture seule de l’espace ne bloque pas cette action.' : `L’assistant consulte uniquement ${current().title}. Aucun message n’est envoyé.`))}</p><div class="form-actions"><button class="btn" data-close>Fermer</button></div>`;
			}
			modal.innerHTML = `${close}<h2 id="modal-title">${title}</h2>${body}`;
			if (!modal.open) modal.showModal();
			(type === 'archive' ? $('[data-close]:not(.close-dialog)', modal) : $('input, textarea, [data-close]', modal))?.focus();
		}
		function toggleTheme() {
			const dark = document.documentElement.dataset.theme !== 'dark';
			document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			$('#theme-toggle').setAttribute('aria-pressed', String(dark));
			$('#theme-toggle').innerHTML = `${icon(dark ? 'sun' : 'moon')}<span>Mode ${dark ? 'clair' : 'sombre'}</span>`;
		}
		function saveSettings(message) { render(); $('#main-content').focus({ preventScroll: true }); announce(message); }
		async function copyInvitation(button) {
			const input = $('#invitation-url');
			try { await navigator.clipboard.writeText(input.value); button.textContent = 'Copié'; $('#copy-status').textContent = 'Lien copié. Valable 7 jours, à usage unique.'; }
			catch { input.focus(); input.select(); $('#copy-status').textContent = 'Lien sélectionné : utilisez Ctrl C ou Cmd C pour le copier.'; }
		}
		document.addEventListener('click', (event) => {
			const target = event.target.closest('a, button');
			if (!target || target.disabled) return;
			if (target.id === 'theme-toggle' || target.hasAttribute('data-theme')) { toggleTheme(); return; }
			if (target.id === 'space-trigger') { setMenu(target.getAttribute('aria-expanded') !== 'true'); return; }
			if (target.id === 'nav-toggle') { const open = target.getAttribute('aria-expanded') !== 'true'; target.setAttribute('aria-expanded', String(open)); $('#site-nav').classList.toggle('open', open); return; }
			if (target.hasAttribute('data-close')) { modal.close(); return; }
			if (target.dataset.go) { go(target.dataset.go); return; }
			if (target.dataset.capture) { openDialog(target.dataset.capture === 'notes' ? 'capture-note' : 'capture-source'); return; }
			if (target.dataset.dialog) { openDialog(target.dataset.dialog); return; }
			if (target.dataset.restore) { state.restore = target.dataset.restore; openDialog('restore'); return; }
			if (target.hasAttribute('data-confirm-restore')) {
				const archived = byId(state.restore);
				if (!archived.owner || !signedIn()) return;
				if (spaces.some((s) => !s.archived && s.name === archived.name)) { $('#restore-error').textContent = 'Le nom est repris par un autre espace'; return; }
				archived.archived = null; state.notice = `« ${archived.title} » est restauré. Ses droits et son mode de lecture sont conservés.`; modal.close(); go('account'); return;
			}
			if (target.hasAttribute('data-copy-invite')) { void copyInvitation(target); return; }
			if (target.dataset.revoke) {
				const index = invitations.findIndex((invitation) => invitation.id === target.dataset.revoke);
				if (index >= 0) invitations.splice(index, 1); saveSettings('Lien révoqué : il ne permet plus de rejoindre l’espace.'); return;
			}
			if (target.dataset.removeMember) {
				const space = settingsSpace(), m = space.members.find((item) => item.id === target.dataset.removeMember);
				if (!m || (m.role === 'proprietaire' && space.members.filter((item) => item.role === 'proprietaire').length === 1)) return;
				space.members = space.members.filter((item) => item.id !== m.id);
				if (m.id === 'frederic') { space.owner = false; go('account'); } else saveSettings(`${m.name} a été retiré. L’espace reste privé.`);
				return;
			}
			if (target.hasAttribute('data-confirm-visibility')) {
				const space = settingsSpace(); space.open = state.visibility === 'open'; space.members = space.open ? [] : [owner()]; modal.close(); saveSettings('Visibilité enregistrée.'); return;
			}
			if (target.hasAttribute('data-favorite')) {
				if (state.favorites.has(state.article)) state.favorites.delete(state.article); else state.favorites.add(state.article);
				target.setAttribute('aria-pressed', String(state.favorites.has(state.article))); announce('Favori mis à jour.'); return;
			}
			if (target.hasAttribute('data-compile') || target.hasAttribute('data-validate')) { openDialog('message', current().readOnly ? readOnlyReason : 'Action simulée dans cet espace. Aucun contenu n’est envoyé au serveur.'); return; }
			if (target.dataset.space) { state.current = target.dataset.space; state.spaceNavigation = true; }
			if (target.dataset.settings) state.settings = target.dataset.settings;
			if (target.dataset.article !== undefined) { state.returnTo = state.screen; state.article = Number(target.dataset.article); state.current = documents[state.article].space; }
			const href = target.getAttribute('href'), destination = href?.slice(1);
			if (target.closest('.prototype')) state.mode = 'member';
			if (target.tagName === 'A' && href?.startsWith('#') && destination !== 'main-content') {
				if (['notes-follow-up', 'resources-section'].includes(destination)) return;
				event.preventDefault();
				if (destination?.startsWith('browse-')) { state.query = destination === 'browse-favorites' ? 'LLM' : ''; state.scope = 'current'; go('search'); }
				else if (['note-daily', 'note-meeting', 'appointment', 'conversations', 'journeys', 'profile', 'sign-in'].includes(destination)) openDialog('message', { 'note-daily': 'Votre note quotidienne conserve les faits et les actions dans cet espace.', 'note-meeting': 'Les décisions de cette réunion restent reliées aux personnes et projets de cet espace.', appointment: 'Les dates, participants et notes liées restent dans cet espace.', conversations: 'Vos conversations restent disponibles dans votre compte.', journeys: 'Vos parcours enregistrés restent disponibles, y compris en lecture seule.', profile: 'Frédéric Matsos · Compte de démonstration.', 'sign-in': 'La connexion ramènerait le visiteur sur cet espace. Aucun espace privé n’est révélé.' }[destination]);
				else go(destination);
			}
		});
		document.addEventListener('pointerdown', (event) => { if (!event.target.closest('.switcher')) setMenu(false); if (!event.target.closest('#site-nav, #nav-toggle') && $('#nav-toggle')) { $('#site-nav').classList.remove('open'); $('#nav-toggle').setAttribute('aria-expanded', 'false'); } });
		document.addEventListener('focusin', (event) => { if (!event.target.closest('.switcher')) setMenu(false); if (!event.target.closest('#site-nav, #nav-toggle') && $('#nav-toggle')) { $('#site-nav').classList.remove('open'); $('#nav-toggle').setAttribute('aria-expanded', 'false'); } });
		document.addEventListener('keydown', (event) => {
			if (modal.open) return;
			if (event.key === 'Escape') { setMenu(false, $('#space-trigger')?.getAttribute('aria-expanded') === 'true'); if ($('#site-nav')?.classList.contains('open')) { $('#site-nav').classList.remove('open'); $('#nav-toggle').setAttribute('aria-expanded', 'false'); $('#nav-toggle').focus(); } }
			if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); if (!$('#query')) go('search'); else $('#query').focus(); }
			if (event.target.closest('.switcher') && ['ArrowDown', 'ArrowUp'].includes(event.key)) { event.preventDefault(); setMenu(true); const links = $$('#space-menu a'), index = links.indexOf(document.activeElement), next = event.key === 'ArrowDown' ? index + 1 : index - 1; links[(next + links.length) % links.length].focus(); }
		});
		document.addEventListener('input', (event) => {
			const input = event.target;
			if (input.id === 'space-name') validateName();
			if (input.dataset.confirm) $('#archive-confirm').disabled = input.value !== input.dataset.confirm;
			if (input.id === 'query' && state.screen.startsWith('search')) { state.query = input.value; renderResults(); }
		});
		document.addEventListener('change', (event) => {
			const input = event.target;
			if (input.id === 'screen') { state.mode = 'member'; state.spaceNavigation = false; go(input.value); }
			if (input.name === 'scope') { state.scope = input.value; renderResults(); }
			if (input.dataset.scopeSpace) { state.selected = $$('[data-scope-space]:checked').map((el) => el.dataset.scopeSpace); renderResults(); }
			if (input.name === 'content') validateContent(input.form, input.form.id === 'create-form' ? 'create' : 'settings');
			if (input.hasAttribute('data-task')) { $('#action-count').textContent = $$('[data-task]:not(:checked)').length; announce('Action mise à jour dans la maquette.'); }
			if (input.name === 'visibility') $('#visibility-hint').textContent = input.value === 'open' ? 'Tous les visiteurs auront accès aux pages. La liste des membres sera vidée après confirmation.' : 'Seuls les membres verront cet espace. Les autres visiteurs recevront une 404.';
		});
		document.addEventListener('submit', (event) => {
			event.preventDefault(); const form = event.target;
			if (form.hasAttribute('data-search')) { state.query = $('#query').value; if (state.screen.startsWith('search')) renderResults(); else go('search'); }
			if (form.id === 'create-form') {
				const content = validateContent(form, 'create'), validName = validateName();
				if (!validName) { $('#space-name').focus(); return; }
				if (!content.length) { $('input[name="content"]', form).focus(); return; }
				if (!$('#create-title').reportValidity()) return;
				const name = $('#space-name').value;
				if (spaces.some((s) => !s.archived && s.name === name)) { validateName(true); $('#space-name').focus(); return; }
				state.created = { id: `created-${name}`, name, title: $('#create-title').value.trim() || name, content, open: false, members: [owner()], owner: true, repo: false, readOnly: false, archived: null, pages: 0, tags: 0, activity: 'À l’instant' };
				spaces.push(state.created); state.current = state.created.id;
				$('#create-submit').disabled = true; $('#create-submit').textContent = 'Création en cours…'; $('#create-status').textContent = 'Première construction de l’espace. Vous allez être redirigé…';
				setTimeout(() => { if (['create', 'invalid', 'taken'].includes(state.screen)) go('empty'); }, 900);
			}
			if (form.id === 'settings-form') {
				const content = validateContent(form, 'settings');
				if (!content.length) { $('input[name="content"]', form).focus(); return; }
				const space = settingsSpace(); space.title = $('#display-title').value.trim() || space.name; space.content = content; saveSettings('Titre et contenus enregistrés. Le slug et l’adresse sont inchangés.');
			}
			if (form.id === 'read-only-form') { settingsSpace().readOnly = $('#read-only-toggle').checked; saveSettings('Mode de lecture enregistré. L’espace reste visible et interrogeable.'); }
			if (form.id === 'invite-form' && !settingsSpace().open) {
				const invitation = { id: `demo-${settingsSpace().name}-${++state.invitationSequence}`, space: settingsSpace().id, role: $('#invite-role').value, expires: '4 décembre 2026 à 14:30' };
				invitations.push(invitation); state.invitation = invitation.id; saveSettings('Lien d’invitation créé. Valable 7 jours, à usage unique.');
			}
			if (form.id === 'capture-form') openDialog('message', `« ${$('#capture-title').value} » serait ajouté dans ${current().title}, puis compilé. Capture web à venir, aucun contenu enregistré.`);
			if (form.id === 'archive-form' && !$('#archive-confirm').disabled) {
				const space = settingsSpace(); if (!space.owner || space.archived) return;
				space.archived = '27 novembre 2026'; state.notice = `« ${space.title} » est archivé : il est caché pour tous et reste restaurable par ses propriétaires.`;
				if (state.current === space.id) state.current = activeSpaces()[0]?.id; modal.close(); go('archives');
			}
		});
		modal.addEventListener('close', () => { if (!modal.open) { if (state.modalReturn?.isConnected) state.modalReturn.focus(); else $('#main-content')?.focus(); } });
		window.addEventListener('hashchange', () => { if (!['notes-follow-up', 'resources-section', 'main-content'].includes(location.hash.slice(1))) navigate(location.hash.slice(1) || 'veille'); });
		navigate(location.hash.slice(1) || 'veille', false);
	})();
	</script>
