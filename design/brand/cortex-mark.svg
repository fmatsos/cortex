<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="96" height="96" role="img" aria-labelledby="t">
  <title id="t">Cortex</title>
  <!-- Master drawing of the Cortex mark: a brain in side profile, front facing right, drawn as a knowledge graph. Eight round nodes (the brand mark's one exception to the square system): five ink ones, the last of them the stem, and the three of the prefrontal cluster in the accent colour, joined by straight links; the outer links draw the silhouette, three inner links tie the back to the cluster. 32-unit grid: at 32 px one unit is one pixel, nodes 3 units across (front nodes 3.5), links 1.3, at least 2 units clear between any node and any other link or node. Butt ends, mitered joins, no curved link. Idle composition. The same geometry from 24 px up (the links thin a little from 40 px); under 24 px see cortex-mark-16.svg. Source of truth for the data: assistant-avatar.svelte. -->
  <style>
    svg { color: #1b2120; --primary: #245849 }
    @media (prefers-color-scheme: dark) { svg { color: #e9e7df; --primary: #a3cbb9 } }
    .links { fill: none; stroke-width: 1.3; stroke-linecap: butt; stroke-linejoin: miter }
  </style>
  <g class="links" stroke="currentColor">
    <path d="M3.5 14.5L9.5 6.5"/>
    <path d="M9.5 6.5L18.5 4"/>
    <path d="M18.5 4L26 8"/>
    <path d="M3.5 14.5L4 20L8 24L15.5 24.5"/>
    <path d="M15.5 24.5L21.5 24L27 20.5L29.5 16"/>
    <path d="M15.5 24.5L15 30"/>
    <path d="M9.5 6.5L21 15"/>
  </g>
  <g class="links" stroke="var(--primary)">
    <path d="M26 8L29.5 16"/>
    <path d="M21 15L26 8"/>
    <path d="M21 15L29.5 16"/>
  </g>
  <g fill="currentColor">
    <circle cx="3.5" cy="14.5" r="1.5"/>
    <circle cx="9.5" cy="6.5" r="1.5"/>
    <circle cx="18.5" cy="4" r="1.5"/>
    <circle cx="15.5" cy="24.5" r="1.5"/>
    <circle cx="15" cy="30" r="1.5"/>
  </g>
  <g fill="var(--primary)">
    <circle cx="26" cy="8" r="1.75"/>
    <circle cx="29.5" cy="16" r="1.75"/>
    <circle cx="21" cy="15" r="1.75"/>
  </g>
</svg>
