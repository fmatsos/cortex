<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" role="img" aria-labelledby="t">
  <title id="t">Cortex</title>
  <!-- Master drawing of the Cortex mark: a brain in side profile, front facing right,
       drawn as a knowledge graph. Round nodes (the brand mark's one exception to the square system) joined by straight links, the
       outer links forming the contour; the prefrontal cluster, at the front, in the accent colour. 48-unit grid, node edges on
       whole pixels at 48 and 96 px. Butt ends, mitered joins, no curved link. Idle composition. Used from 40 px; below that the
       small glyphs apply (cortex-mark-16.svg). -->
  <style>
    svg { color: #1b2120; --primary: #245849 }
    @media (prefers-color-scheme: dark) { svg { color: #e9e7df; --primary: #a3cbb9 } }
    .links { fill: none; stroke-width: 1; stroke-linecap: butt; stroke-linejoin: miter }
  </style>
  <g class="links" stroke="currentColor">
    <path d="M6 22L7 16L10 12L16 9L22 8L34 10"/>
    <path d="M6 22L5 26L7 29L10 32L12 36L16 38L16 40"/>
    <path d="M30 28L28 31L26 33L22 34L20 34"/>
    <path d="M10 12L18 20"/>
    <path d="M22 8L18 20"/>
    <path d="M6 22L18 20"/>
    <path d="M18 20L10 32"/>
    <path d="M18 20L30 28"/>
    <path d="M10 32L20 34"/>
    <path d="M20 34L16 40"/>
  </g>
  <g class="links" stroke="var(--primary)">
    <path d="M34 10L39 14L42 20L41 25L36 28L30 28"/>
    <path d="M18 20L26 16"/>
    <path d="M26 16L34 10"/>
    <path d="M26 16L42 20"/>
    <path d="M26 16L30 28"/>
    <path d="M42 20L30 28"/>
  </g>
  <g fill="currentColor">
    <circle cx="22" cy="8" r="2"/>
    <circle cx="10" cy="12" r="2"/>
    <circle cx="6" cy="22" r="2"/>
    <circle cx="18" cy="20" r="2"/>
    <circle cx="10" cy="32" r="2"/>
    <circle cx="20" cy="34" r="2"/>
    <circle cx="16" cy="40" r="2"/>
  </g>
  <g fill="var(--primary)">
    <circle cx="34" cy="10" r="2"/>
    <circle cx="26" cy="16" r="2"/>
    <circle cx="42" cy="20" r="2"/>
    <circle cx="30" cy="28" r="2"/>
  </g>
</svg>
