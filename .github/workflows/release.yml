name: release
# Publishing a version: bump "version" in package.json, commit, then `git tag v<version> && git push --tags`.
# Each binary is built on its own platform (a macOS binary must be signed on macOS), then one job publishes them.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, asset: cortex-linux-x64 }
          - { os: macos-14, asset: cortex-darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Tag matches package.json
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile --omit optional
      # the binary embeds the sources; cortex export installs the site's locked dependencies in the user's cache
      - run: scripts/build.sh ${{ matrix.asset }}
      - run: ./${{ matrix.asset }} --help >/dev/null
      - name: Export works from the binary alone
        run: |
          w=$(mktemp -d) && cd "$w" && "$OLDPWD/${{ matrix.asset }}" config init >/dev/null
          p=$(CORTEX_ROOT="$w" "$OLDPWD/${{ matrix.asset }}" new Concept "Test")
          perl -pi -e 's/^type: Concept$/type: Concept\ntags: [test]/' "$p"
          env -i HOME="$w/home" PATH=/usr/bin:/bin CORTEX_ROOT="$w" "$OLDPWD/${{ matrix.asset }}" export --out "$w/site"
          test -f "$w/site/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: actions/checkout@v5
        with:
          path: repo
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sha256sum cortex-* > SHA256SUMS
      # cortex upgrade refuses a SHA256SUMS whose signature does not match the public key built into the binary
      - run: bun repo/scripts/sign.ts SHA256SUMS
        env:
          CORTEX_SIGNING_KEY: ${{ secrets.CORTEX_SIGNING_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" cortex-* SHA256SUMS SHA256SUMS.sig --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
